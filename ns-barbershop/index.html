<!-- Tarjeta de Lealtad VIP (Punch Card) -->
<div class="w-full max-w-md mx-auto bg-neutral-900 border border-amber-500/30 rounded-2xl p-6 shadow-2xl text-center text-white">
  
  <!-- Header Badge -->
  <div class="inline-block border border-amber-500/50 rounded-full px-4 py-1 mb-4">
    <span class="text-xs uppercase tracking-widest text-amber-400 font-semibold">Tarjeta de Lealtad VIP</span>
  </div>

  <!-- Main Title -->
  <h3 class="text-xl font-bold tracking-tight mb-2">Acumula 5 cortes y gana</h3>
  <p class="text-xs text-neutral-400 mb-6">Muestra esta pantalla a tu barbero en cada visita para sellar tu pase.</p>

  <!-- Punch Grid (5 Slots) -->
  <div class="grid grid-cols-5 gap-2 mb-6">
    <!-- Corte 1 (Stamped Example) -->
    <div class="flex flex-col items-center">
      <div class="w-12 h-12 rounded-xl bg-amber-500/20 border-2 border-amber-500 flex items-center justify-center text-amber-400 shadow-inner">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
      </div>
      <span class="text-[10px] text-neutral-400 mt-1">1er</span>
    </div>

    <!-- Corte 2 (Empty) -->
    <div class="flex flex-col items-center">
      <div class="w-12 h-12 rounded-xl bg-neutral-800 border-2 border-dashed border-neutral-600 flex items-center justify-center text-neutral-500">
        <span class="text-xs font-bold">2</span>
      </div>
      <span class="text-[10px] text-neutral-500 mt-1">2do</span>
    </div>

    <!-- Corte 3 (Empty) -->
    <div class="flex flex-col items-center">
      <div class="w-12 h-12 rounded-xl bg-neutral-800 border-2 border-dashed border-neutral-600 flex items-center justify-center text-neutral-500">
        <span class="text-xs font-bold">3</span>
      </div>
      <span class="text-[10px] text-neutral-500 mt-1">3er</span>
    </div>

    <!-- Corte 4 (Empty) -->
    <div class="flex flex-col items-center">
      <div class="w-12 h-12 rounded-xl bg-neutral-800 border-2 border-dashed border-neutral-600 flex items-center justify-center text-neutral-500">
        <span class="text-xs font-bold">4</span>
      </div>
      <span class="text-[10px] text-neutral-500 mt-1">4to</span>
    </div>

    <!-- Corte 5 (Reward Slot) -->
    <div class="flex flex-col items-center">
      <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-amber-400 to-amber-600 border-2 border-amber-300 flex items-center justify-center text-neutral-950 shadow-lg shadow-amber-500/20">
        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      </div>
      <span class="text-[10px] text-amber-400 font-bold mt-1">¡Gratis!</span>
    </div>
  </div>

  <!-- Reward Banner -->
  <div class="bg-neutral-800/80 border border-neutral-700 rounded-xl p-3 text-xs text-neutral-300">
    Recompensa al 5to corte: <span class="text-amber-400 font-bold">¡Corte GRATIS o 50% OFF!</span>
  </div>
</div>
