<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NS Barber Shop - Califica Nuestra Experiencia</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: #141414;
            --border-color: #262626;
            --accent-gold: #f59e0b;
            --text-main: #ffffff;
            --text-muted: #a3a3a3;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .card-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 32px 24px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            animation: fadeIn 0.6s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo-badge {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
            font-size: 1.75rem;
            box-shadow: 0 8px 20px rgba(245, 158, 11, 0.3);
        }
        h1 {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }
        p {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 28px;
            line-height: 1.4;
        }
        .stars {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .star {
            font-size: 2.25rem;
            color: #333333;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), color 0.2s ease;
        }
        .star:hover {
            color: var(--accent-gold);
            transform: scale(1.2);
        }
        .feedback-box {
            background-color: #1a1a1a;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            text-align: left;
            animation: slideUp 0.4s ease-out;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .feedback-box h3 {
            font-size: 0.95rem;
            color: var(--accent-gold);
            margin-top: 0;
            margin-bottom: 6px;
        }
        .feedback-box p {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 14px;
        }
        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            font-size: 0.85rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: #0f0f0f;
            color: #fff;
            margin-bottom: 14px;
            min-height: 80px;
            resize: none;
            font-family: inherit;
        }
        textarea:focus {
            outline: none;
            border-color: var(--accent-gold);
        }
        button {
            background-color: var(--accent-gold);
            color: #0f0f0f;
            font-weight: 700;
            font-size: 0.85rem;
            padding: 12px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s ease;
        }
        button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="card-container" id="review-container">
        <div class="logo-badge">✂️</div>
        <h1>NS Barber Shop</h1>
        <p>¿Cómo calificarías tu experiencia hoy en la silla?</p>
        
        <div class="stars">
            <span class="star" onmouseover="highlightStars(1)" onmouseout="resetStars()" onclick="handleStarRating(1)">★</span>
            <span class="star" onmouseover="highlightStars(2)" onmouseout="resetStars()" onclick="handleStarRating(2)">★</span>
            <span class="star" onmouseover="highlightStars(3)" onmouseout="resetStars()" onclick="handleStarRating(3)">★</span>
            <span class="star" onmouseover="highlightStars(4)" onmouseout="resetStars()" onclick="handleStarRating(4)">★</span>
            <span class="star" onmouseover="highlightStars(5)" onmouseout="resetStars()" onclick="handleStarRating(5)">★</span>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://dnmkiknhodbjtjesoskj.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRubWtpa25ob2RianRqZXNvc2tqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0MDQ0MDgsImV4cCI6MjA5NTk4MDQwOH0.IF92scBKKqlAzE9rIANUWeJElqGAZznGFwKJ6yS1xDs';

        function highlightStars(count) {
            const stars = document.querySelectorAll('.star');
            stars.forEach((star, index) => {
                if (index < count) {
                    star.style.color = '#f59e0b';
                } else {
                    star.style.color = '#333333';
                }
            });
        }

        function resetStars() {
            const stars = document.querySelectorAll('.star');
            stars.forEach(star => {
                star.style.color = '#333333';
            });
        }

        async function logCardEventToSupabase(rating) {
            try {
                await fetch(`${SUPABASE_URL}/rest/v1/card_events`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify({
                        event_type: rating >= 4 ? 'positive_redirect' : 'negative_feedback',
                        rating_value: rating
                    })
                });
            } catch (error) {
                console.error("Error secundario en analítica:", error);
            }
        }

        function handleStarRating(rating) {
            logCardEventToSupabase(rating);

            if (rating >= 4) {
                // Pantalla de transición sutil antes de abrir Google
                let container = document.getElementById('review-container');
                container.innerHTML = `
                    <div style="padding: 20px 0;">
                        <div style="font-size: 3rem; margin-bottom: 10px;">✨</div>
                        <h2 style="font-size: 1.2rem; color: #f59e0b; margin-bottom: 8px;">¡Muchas gracias!</h2>
                        <p style="margin-bottom: 0;">Redirigiéndote a Google Maps...</p>
                    </div>
                `;
                setTimeout(() => {
                    window.location.href = "https://search.google.com/local/writereview?placeid=ChIJvWRSJir9oI8RSdksjeB_J_Q";
                }, 800);
            } else {
                let container = document.getElementById('review-container');
                container.innerHTML = `
                    <div class="feedback-box">
                      <h3>Ayúdanos a mejorar</h3>
                      <p>Lamentamos que tu experiencia no haya sido perfecta. Cuéntanos qué pasó:</p>
                      <form action="https://formspree.io/f/xbgjqwrq" method="POST">
                        <textarea name="feedback" required placeholder="Escribe tus comentarios aquí..."></textarea>
                        <input type="hidden" name="rating" value="${rating} Estrellas">
                        <button type="submit">Enviar Comentario</button>
                      </form>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
