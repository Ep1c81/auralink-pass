<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NS Barber Shop - Tarjeta de Lealtad VIP</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .card-container {
            background-color: #1c1c1e;
            border: 1px solid #2c2c2e;
            border-radius: 16px;
            padding: 32px 24px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 16px 32px rgba(0,0,0,0.6);
        }
        h1 {
            font-size: 1.35rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #f59e0b;
        }
        p {
            font-size: 0.85rem;
            color: #8e8e93;
            margin-bottom: 24px;
        }
        .stars {
            display: flex;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
        }
        .star {
            font-size: 2.2rem;
            color: #3a3a3c;
            transition: color 0.2s ease;
        }
        .star:hover,
        .star.active {
            color: #f59e0b;
        }
    </style>
</head>
<body>

    <div class="card-container" id="review-stars-container">
        <h1>NS Barber Shop</h1>
        <p>Tarjeta de Lealtad VIP<br>¿Cómo calificarías tu experiencia hoy en la silla?</p>
        
        <div class="stars">
            <span class="star" onclick="handleStarRating(1)">★</span>
            <span class="star" onclick="handleStarRating(2)">★</span>
            <span class="star" onclick="handleStarRating(3)">★</span>
            <span class="star" onclick="handleStarRating(4)">★</span>
            <span class="star" onclick="handleStarRating(5)">★</span>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://dnmkiknhodbjtjesoskj.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRubWtpa25ob2RianRqZXNvc2tqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0MDQ0MDgsImV4cCI6MjA5NTk4MDQwOH0.IF92scBKKqlAzE9rIANUWeJElqGAZznGFwKJ6yS1xDs';

        async function logCardEventToSupabase(rating) {
            try {
                await fetch(`${SUPABASE_URL}/rest/v1/card_events`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify({
                        event_type: rating >= 4 ? 'positive_redirect' : 'negative_feedback',
                        rating_value: rating
                    })
                });
            } catch (error) {
                console.error("Error secundario en analítica:", error);
            }
        }

        function handleStarRating(rating) {
            logCardEventToSupabase(rating);

            if (rating >= 4) {
                window.location.href = "https://search.google.com/local/writereview?placeid=ChIJvWRSJir9oI8RSdksjeB_J_Q";
            } else {
                let feedbackSection = document.getElementById('review-stars-container');
                feedbackSection.innerHTML = `
                    <div style="text-align: left;">
                      <p style="color: #f59e0b; font-weight: bold; margin-bottom: 8px;">Ayúdanos a mejorar</p>
                      <p style="font-size: 0.8rem; color: #8e8e93; margin-bottom: 12px;">Cuéntanos qué sucedió:</p>
                      <form action="https://formspree.io/f/xbgjqwrq" method="POST" style="margin: 0;">
                        <textarea name="feedback" required placeholder="Escribe tu comentario..." style="width: 100%; box-sizing: border-box; padding: 10px; font-size: 0.85rem; border-radius: 8px; border: 1px solid #3a3a3c; background: #121212; color: #fff; margin-bottom: 12px; min-height: 70px; resize: none;"></textarea>
                        <input type="hidden" name="rating" value="${rating} Estrellas">
                        <button type="submit" style="background-color: #f59e0b; color: #121212; font-weight: bold; font-size: 0.85rem; padding: 10px; border-radius: 8px; border: none; cursor: pointer; width: 100%;">Enviar Comentario</button>
                      </form>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
