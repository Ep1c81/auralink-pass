<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NS Barber Shop - Califica Nuestra Experiencia</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .card-container {
            background-color: #1e1e1e;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 1.25rem;
            margin-bottom: 8px;
            color: #f59e0b;
        }
        p {
            font-size: 0.85rem;
            color: #a3a3a3;
            margin-bottom: 20px;
        }
        .stars {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 16px;
            cursor: pointer;
        }
        .star {
            font-size: 2rem;
            color: #525252;
            transition: color 0.2s ease;
        }
        .star:hover,
        .star.active {
            color: #f59e0b;
        }
    </style>
</head>
<body>

    <div class="card-container" id="review-stars-container">
        <h1>NS Barber Shop</h1>
        <p>¿Cómo calificarías tu experiencia hoy en la silla?</p>
        
        <div class="stars">
            <span class="star" onclick="handleStarRating(1)">★</span>
            <span class="star" onclick="handleStarRating(2)">★</span>
            <span class="star" onclick="handleStarRating(3)">★</span>
            <span class="star" onclick="handleStarRating(4)">★</span>
            <span class="star" onclick="handleStarRating(5)">★</span>
        </div>
    </div>

    <script>
        // Tus credenciales de Supabase (AuraLinkDigital)
        const SUPABASE_URL = 'https://dnmkiknhodbjtjesoskj.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRubWtpa25ob2RianRqZXNvc2tqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0MDQ0MDgsImV4cCI6MjA5NTk4MDQwOH0.IF92scBKKqlAzE9rIANUWeJElqGAZznGFwKJ6yS1xDs';
        
        // Identificador opcional para asociar directamente el evento al negocio en Supabase
        const BUSINESS_SLUG = 'ns-barbershop';

        async function logCardEventToSupabase(rating) {
            try {
                // Registro asíncrono en segundo plano (No bloquea la experiencia del cliente)
                await fetch(`${SUPABASE_URL}/rest/v1/card_events`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify({
                        event_type: rating >= 4 ? 'positive_redirect' : 'negative_feedback',
                        rating_value: rating
                    })
                });
            } catch (error) {
                // Si la red falla por cualquier motivo, la redirección sigue su curso sin interrumpir al usuario
                console.error("Error secundario en analítica:", error);
            }
        }

        function handleStarRating(rating) {
            // 1. Enviamos el registro de analítica de forma silenciosa
            logCardEventToSupabase(rating);

            // 2. Evaluamos la ruta según la calificación otorgada
            if (rating >= 4) {
                window.location.href = "https://search.google.com/local/writereview?placeid=ChIJvWRSJir9oI8RSdksjeB_J_Q";
            } else {
                let feedbackSection = document.getElementById('review-stars-container');
                feedbackSection.innerHTML = `
                    <div style="background-color: #262626; border: 1px solid #f59e0b; border-radius: 0.5rem; padding: 0.85rem; text-align: left;">
                      <p style="font-size: 0.8rem; color: #fbbf24; font-weight: bold; margin-bottom: 0.4rem; margin-top: 0;">Ayúdanos a mejorar</p>
                      <p style="font-size: 0.7rem; color: #d4d4d4; margin-bottom: 0.6rem;">Por favor cuéntanos qué sucedió:</p>
                      <form action="https://formspree.io/f/xbgjqwrq" method="POST" style="margin: 0;">
                        <textarea name="feedback" required placeholder="Escribe tu comentario aquí..." style="width: 100%; box-sizing: border-box; padding: 0.45rem; font-size: 0.8rem; border-radius: 0.25rem; border: 1px solid #525252; background: #171717; color: #fff; margin-bottom: 0.6rem; min-height: 55px; font-family: sans-serif;"></textarea>
                        <input type="hidden" name="rating" value="${rating} Estrellas">
                        <button type="submit" style="background-color: #f59e0b; color: #171717; font-weight: bold; font-size: 0.8rem; padding: 0.45rem 0.85rem; border-radius: 0.25rem; border: none; cursor: pointer; width: 100%;">Enviar Comentario</button>
                      </form>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
