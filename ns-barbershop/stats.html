<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NS Barber Shop - Panel de Rendimiento VIP</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .dashboard-container {
            background-color: #1c1c1e;
            border: 1px solid #2c2c2e;
            border-radius: 16px;
            padding: 24px 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 16px 32px rgba(0,0,0,0.6);
        }
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        .header h1 {
            font-size: 1.2rem;
            margin: 0 0 6px 0;
            color: #ffffff;
        }
        .header p {
            font-size: 0.8rem;
            color: #8e8e93;
            margin: 0;
        }
        .metric-card {
            background: #2c2c2e;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .metric-info h3 {
            font-size: 0.75rem;
            color: #8e8e93;
            margin: 0 0 4px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .metric-info .value {
            font-size: 1.6rem;
            font-weight: bold;
            color: #f59e0b;
            margin: 0;
        }
        .metric-icon {
            font-size: 1.8rem;
        }
        .revenue-box {
            background: linear-gradient(135deg, #1f2937, #111827);
            border: 1px solid #f59e0b;
            border-radius: 12px;
            padding: 18px;
            text-align: center;
            margin-top: 20px;
        }
        .revenue-box h3 {
            font-size: 0.8rem;
            color: #f59e0b;
            margin: 0 0 8px 0;
            text-transform: uppercase;
        }
        .revenue-box .rev-amount {
            font-size: 1.3rem;
            font-weight: bold;
            color: #ffffff;
            margin: 0;
        }
        .revenue-box p {
            font-size: 0.75rem;
            color: #9ca3af;
            margin: 6px 0 0 0;
        }
        .footer-brand {
            text-align: center;
            margin-top: 20px;
            font-size: 0.7rem;
            color: #636366;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="header">
            <h1>NS Barber Shop ✂️</h1>
            <p>Reporte de Impacto Comercial en Tiempo Real</p>
        </div>

        <div class="metric-card">
            <div class="metric-info">
                <h3>Reseñas 5 Estrellas (Google Maps)</h3>
                <p class="value" id="val-reviews">34</p>
            </div>
            <div class="metric-icon">⭐</div>
        </div>

        <div class="metric-card">
            <div class="metric-info">
                <h3>Interacciones Registradas (NFC)</h3>
                <p class="value" id="val-scans">Cargando...</p>
            </div>
            <div class="metric-icon">📱</div>
        </div>

        <div class="revenue-box">
            <h3>Impacto en Posicionamiento</h3>
            <p class="rev-amount">De 2 a 34 Reseñas Reales</p>
            <p>Salto directo al Top de Búsquedas Locales</p>
        </div>

        <div class="footer-brand">
            Powered by AuraLinkDigital Intelligence
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://dnmkiknhodbjtjesoskj.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRubWtpa25ob2RianRqZXNvc2tqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0MDQ0MDgsImV4cCI6MjA5NTk4MDQwOH0.IF92scBKKqlAzE9rIANUWeJElqGAZznGFwKJ6yS1xDs';

        async function fetchRealtimeMetrics() {
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/card_events?select=*`, {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('val-scans').innerText = data.length;
                } else {
                    document.getElementById('val-scans').innerText = "0";
                }
            } catch (error) {
                console.error("Error al sincronizar métricas:", error);
                document.getElementById('val-scans').innerText = "0";
            }
        }

        fetchRealtimeMetrics();
    </script>
</body>
</html>
