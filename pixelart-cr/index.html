<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PixelArtCR / Multi-impresos - Reseña y Sitio Web</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      padding: 1.5rem;
    }
    .card {
      background: #ffffff;
      color: #0f172a;
      padding: 2.2rem 1.8rem;
      border-radius: 20px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      max-width: 380px;
      width: 100%;
      text-align: center;
    }
    .brand-title {
      font-size: 1.5rem;
      font-weight: 800;
      margin: 0 0 0.4rem 0;
      color: #0f172a;
      letter-spacing: -0.025em;
    }
    .subtitle {
      font-size: 0.95rem;
      color: #64748b;
      margin: 0 0 1.8rem 0;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      width: 100%;
      margin-bottom: 0.9rem;
      padding: 0.95rem 1.2rem;
      color: white;
      text-decoration: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1rem;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-google {
      background-color: #4285F4;
      box-shadow: 0 4px 12px rgba(66, 133, 244, 0.3);
    }
    .btn-website {
      background: linear-gradient(135deg, #ff007a 0%, #9333ea 50%, #3b82f6 100%);
      box-shadow: 0 6px 20px rgba(147, 51, 234, 0.4);
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1 class="brand-title">PixelArtCR</h1>
    <p class="subtitle">Multi-impresos & Imprenta</p>
    
    <a href="https://maps.google.com/?q=place_id:ChIJgXz5kL3koI8R4_cM_U2KxgM" class="btn btn-google">
      ⭐ Dejar Reseña en Google
    </a>

    <a href="http://www.pixelartcr.com/" target="_blank" rel="noopener noreferrer" class="btn btn-website">
      🌐 Visitar Sitio Web Oficial
    </a>
  </div>
</body>
</html>
