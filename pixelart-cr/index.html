<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelArtCR | Califica tu experiencia</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #111827 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            padding: 35px 25px;
            text-align: center;
        }

        .logo { max-width: 120px; margin: 0 auto 15px; display: block; border-radius: 12px; }
        h1 { font-size: 26px; color: #0f172a; margin-bottom: 4px; font-weight: 800; letter-spacing: -0.5px; }
        p.subtitle { font-size: 15px; color: #64748b; margin-bottom: 25px; font-weight: 500; }

        /* Massive Review Gate Box for Mobile Tapping */
        .rating-box {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            padding: 25px 15px;
            margin-bottom: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.05);
        }
        .rating-text {
            font-size: 18px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 15px;
        }
        .stars {
            display: flex;
            justify-content: center;
            gap: 12px;
        }
        .star-btn {
            font-size: 42px; /* Increased size for easier mobile tapping */
            color: #cbd5e1;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent; /* Removes blue flash on mobile tap */
        }
        /* Make stars gold by default to look more inviting */
        .star-btn { color: #FFD43B; }

        /* Secondary Action Button */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 14px;
        }
        .btn-website {
            background: linear-gradient(135deg, #ec4899 0%, #6366f1 100%);
            color: white;
            box-shadow: 0 8px 16px rgba(236, 72, 153, 0.25);
        }
        .btn i { margin-right: 12px; font-size: 20px; }

        /* Contact Box */
        .contact-box {
            background: #f8fafc;
            border-radius: 16px;
            padding: 20px 15px;
            margin: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }
        .contact-item {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            width: fit-content;
            font-size: 16px;
            font-weight: 600;
            white-space: nowrap;
        }
        .contact-item i { width: 28px; text-align: left; font-size: 20px; }
        .contact-item a { color: #334155; text-decoration: none; }
        .icon-phone { color: #3b82f6; }
        .icon-wa { color: #25D366; }

        /* QR Section */
        .qr-section { margin-top: 20px; padding-top: 25px; border-top: 2px dashed #e2e8f0; }
        .qr-section p { font-size: 14px; color: #475569; margin-bottom: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .qr-code { width: 140px; height: 140px; border-radius: 12px; border: 3px solid #f8fafc; }
    </style>
</head>
<body>
    <div class="card">
        <img src="./pixelartcr-logo.jpg" alt="Logo de PixelArtCR" class="logo">
        
        <h1>PixelArtCR</h1>
        <p class="subtitle">Multi-impresos & Imprenta</p>

        <!-- The 5 Stars are right here on the main page -->
        <div class="rating-box">
            <div class="rating-text">¿Cómo calificarías tu experiencia?</div>
            <div class="stars">
                <i class="fa-solid fa-star star-btn" data-value="1"></i>
                <i class="fa-solid fa-star star-btn" data-value="2"></i>
                <i class="fa-solid fa-star star-btn" data-value="3"></i>
                <i class="fa-solid fa-star star-btn" data-value="4"></i>
                <i class="fa-solid fa-star star-btn" data-value="5"></i>
            </div>
        </div>

        <a href="https://pixelartcr.com" class="btn btn-website" target="_blank">
            <i class="fa-solid fa-globe"></i> Visitar Sitio Web Oficial
        </a>

        <div class="contact-box">
            <div class="contact-item">
                <i class="fa-solid fa-phone icon-phone"></i>
                <a href="tel:+50622821870">(506) 2282-1870</a>
            </div>
            <div class="contact-item">
                <i class="fa-brands fa-whatsapp icon-wa"></i>
                <a href="https://wa.me/50687011953" target="_blank">Cel: (506) 8701-1953</a>
            </div>
        </div>

        <div class="qr-section">
            <p>¡Escanea para calificarnos!</p>
            <img src="https://quickchart.io/qr?text=https://auralink-pass.vercel.app/pixelart-cr&size=200&margin=2" alt="Código QR para Reseña" class="qr-code">
        </div>
    </div>

    <!-- Mobile-Optimized Single-Tap Logic -->
    <script>
        const starList = document.querySelectorAll('.star-btn');
        
        starList.forEach(star => {
            // "touchstart" and "click" combined ensures instant mobile response
            star.addEventListener('click', function(e) {
                e.preventDefault(); // Prevents double-firing on some browsers
                const rating = parseInt(this.getAttribute('data-value'));
                
                if (rating >= 4) {
                    // 4 or 5 stars -> Direct to Google Review Pop-up
                    window.location.href = 'https://search.google.com/local/writereview?placeid=ChIJwxanJBD8oI8RAhC8IiIqMqo';
                } else {
                    // 1, 2, or 3 stars -> Direct to Management WhatsApp
                    const message = encodeURIComponent(`Hola. Mi calificación fue de ${rating} estrellas. Me gustaría dejar el siguiente comentario sobre mi experiencia para que puedan mejorar: `);
                    window.location.href = `https://wa.me/50687011953?text=${message}`;
                }
            });
        });
    </script>
</body>
</html>
